name: Update Year in README

on:
  schedule:
    - cron: '0 0 1 1 *'
  workflow_dispatch:

jobs:
  update-year:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update Year
        run: |
          CURRENT_YEAR=$(date +'%Y')
          sed -i "s/AMIRMOHAMMAD GHASEMZADEH | [0-9]\{4\}/AMIRMOHAMMAD GHASEMZADEH | $CURRENT_YEAR/" README.md

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: update year in footer"
          git push
